# Render Blueprint para el backend de Migo.
# En Render: New + → Blueprint → conecta este repo. Render lee este archivo.
# Las variables con `sync: false` las pegas tú en el dashboard (valores de tu server/.env).
services:
  - type: web
    name: migo-api
    runtime: node
    plan: free # se duerme tras ~15 min de inactividad (cold start); suficiente para probar
    rootDir: server
    # Se ejecuta con tsx (igual que en dev) en lugar de compilar con tsc: evita
    # incompatibilidades del toolchain de TypeScript en el entorno de build de Render.
    # --include=dev asegura que tsx/prisma (devDependencies) queden instalados.
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npx tsx src/server.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Fijar Node LTS (evita que Render use una versión demasiado nueva/bleeding-edge)
      - key: NODE_VERSION
        value: "22"
      # Secretos: pégalos en el dashboard (Environment) desde tu server/.env
      - key: DATABASE_URL # Supabase pooler (:6543 con pgbouncer=true)
        sync: false
      - key: DIRECT_URL # Supabase directo (:5432) — opcional, para migraciones
        sync: false
      - key: CORS_ORIGINS # URLs de los frontends desplegados (Cloudflare Pages), separadas por coma
        sync: false
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Google OAuth Client IDs (públicos): Web, Android cliente, Android vet
      - key: GOOGLE_CLIENT_IDS
        value: 967962081340-023koe87cn4vadbf771oe533hg62r5ug.apps.googleusercontent.com,967962081340-tj95o2pbt1ilqrnn87va0pd5qra9pgka.apps.googleusercontent.com,967962081340-hooajjob19cpg446e60enmqn0hr0b9ta.apps.googleusercontent.com
      # JWT: Render los genera fuertes automáticamente (una vez)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
